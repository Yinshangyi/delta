id: no-imperative-stream-accumulation
valid:
  - "const xs = Stream.run(s, Sink.collectAll())"
  - "Stream.runForEach((x) => Ref.update(ref, Array.append(x)))"
  - "Effect.sync(() => arr.push(x))"
invalid:
  - "Stream.runForEach((x) => Effect.sync(() => { acc.push(x); }))"
  - "Stream.tap((x) => Effect.sync(() => acc.push(x)))"
