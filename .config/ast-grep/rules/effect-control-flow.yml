id: no-match-when-tag
language: typescript
severity: error
message: "Use `Match.tag(...)` instead of `Match.when({ _tag: ... })`."
note: |
  Matching a tagged union on its discriminant should use the dedicated `Match.tag(tag, f)`
  combinator, not the low-level `Match.when({ _tag: ... }, f)` object pattern. `Match.tag` reads
  the intent directly and narrows by tag without restating the `_tag` field.
rule:
  pattern: "Match.when({ _tag: $T }, $$$ARGS)"
---
