id: no-unbound-catch
language: typescript
severity: error
message: Binding-less `catch {` discards the failure — route it through Effect.
note: |
  A `catch {` with no error binding cannot inspect, log, or rethrow the failure — it is
  structurally swallowed. Route failures through Effect instead of raw try/catch
  (`Effect.catchAll`/`orElse`/`option`, or the catch handler of `Effect.try`/`Effect.tryPromise`).
rule:
  kind: catch_clause
  all:
    - has: { field: body, kind: statement_block }
    - not:
        has: { field: parameter, kind: identifier }
---
id: no-tag-access
language: typescript
severity: error
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
message: Reads the `_tag` discriminant directly.
note: |
  `_tag` is an implementation detail of a tagged union. Never read it directly — dispatch via
  `Match.valueTags` / `Match.tag` or narrow with `Schema.is` guards.
rule:
  pattern: $X._tag
